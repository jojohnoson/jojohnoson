<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 225" width="100%" height="225">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#081427" />
      <stop offset="100%" stop-color="#030610" />
    </linearGradient>

    <!-- Glowing Border -->
    <linearGradient id="arch-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="node-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b172a" />
      <stop offset="100%" stop-color="#060c18" />
    </linearGradient>

    <!-- Laser Flow Gradient -->
    <linearGradient id="laser-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="arch-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes flow-dash {
      to { stroke-dashoffset: -40; }
    }
    .flow-line {
      stroke-dasharray: 6 4;
      animation: flow-dash 1.6s linear infinite;
    }
    .pulse-live {
      animation: pulse-dot 2s ease-in-out infinite;
      transform-origin: 708px 18px;
    }
    .node-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .node-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .node-badge {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 9.5px;
      font-weight: 600;
    }
  </style>

  <!-- Outer Card Background -->
  <rect width="860" height="225" rx="12" fill="url(#arch-bg)" stroke="url(#arch-border)" stroke-width="1.2" />
  <rect width="860" height="225" rx="12" fill="url(#arch-grid)" />

  <!-- Top Bar -->
  <rect x="1" y="1" width="858" height="34" rx="11" fill="#091528" fill-opacity="0.9" />
  <line x1="0" y1="35" x2="860" y2="35" stroke="#1e293b" stroke-width="1" />

  <!-- Window Traffic Lights -->
  <circle cx="24" cy="18" r="4.5" fill="#ef4444" />
  <circle cx="39" cy="18" r="4.5" fill="#f59e0b" />
  <circle cx="54" cy="18" r="4.5" fill="#10b981" />

  <!-- Top Bar Header Title -->
  <text x="74" y="22" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#64748b">
    ARCHITECTURE BLUEPRINT: <tspan fill="#38bdf8">ENTERPRISE GITOPS &amp; CLOUD PLATFORM</tspan>
  </text>

  <!-- Status Pill -->
  <rect x="696" y="8" width="144" height="20" rx="10" fill="#071426" stroke="#0284c7" stroke-width="0.8" />
  <circle cx="708" cy="18" r="3.5" fill="#10b981" class="pulse-live" />
  <text x="718" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">CONTINUOUS GITOPS</text>

  <!-- Connecting Flow Lines (Animated) -->
  <!-- Connection 1 -> 2 -->
  <line x1="205" y1="128" x2="245" y2="128" stroke="#38bdf8" stroke-width="2" class="flow-line" filter="url(#glow-cyan)" />
  <polygon points="248,128 240,124 240,132" fill="#38bdf8" />

  <!-- Connection 2 -> 3 -->
  <line x1="425" y1="128" x2="465" y2="128" stroke="#38bdf8" stroke-width="2" class="flow-line" filter="url(#glow-cyan)" />
  <polygon points="468,128 460,124 460,132" fill="#38bdf8" />

  <!-- Connection 3 -> 4 -->
  <line x1="645" y1="128" x2="685" y2="128" stroke="#38bdf8" stroke-width="2" class="flow-line" filter="url(#glow-cyan)" />
  <polygon points="688,128 680,124 680,132" fill="#38bdf8" />

  <!-- STAGE 1: Source & Code -->
  <g transform="translate(25, 52)">
    <rect width="180" height="152" rx="9" fill="url(#node-bg)" stroke="#1e3a8a" stroke-width="1.1" />
    <rect x="0" y="0" width="180" height="28" rx="8" fill="#0f1f38" />
    <circle cx="16" cy="14" r="4" fill="#38bdf8" />
    <text x="27" y="18" class="node-title" fill="#38bdf8">01. Source &amp; VCS</text>
    
    <text x="14" y="48" class="node-badge" fill="#f8fafc">❯ Developer Push</text>
    <text x="14" y="66" class="node-sub">• GitHub Repository</text>
    <text x="14" y="82" class="node-sub">• Webhook Dispatch</text>
    <text x="14" y="98" class="node-sub">• Branch Protection Rules</text>
    
    <rect x="12" y="116" width="156" height="24" rx="6" fill="#081324" stroke="#0284c7" stroke-width="0.7" />
    <text x="90" y="132" text-anchor="middle" class="node-badge" fill="#38bdf8">Git Commits / PRs</text>
  </g>

  <!-- STAGE 2: Automated CI & DevSecOps -->
  <g transform="translate(245, 52)">
    <rect width="180" height="152" rx="9" fill="url(#node-bg)" stroke="#0284c7" stroke-width="1.1" />
    <rect x="0" y="0" width="180" height="28" rx="8" fill="#0e2343" />
    <circle cx="16" cy="14" r="4" fill="#0ea5e9" />
    <text x="27" y="18" class="node-title" fill="#38bdf8">02. CI &amp; DevSecOps</text>
    
    <text x="14" y="48" class="node-badge" fill="#f8fafc">❯ Jenkins Pipelines</text>
    <text x="14" y="66" class="node-sub">• SonarQube Quality Gate</text>
    <text x="14" y="82" class="node-sub">• Trivy Container CVE Scan</text>
    <text x="14" y="98" class="node-sub">• Multi-Stage Docker Build</text>

    <rect x="12" y="116" width="156" height="24" rx="6" fill="#081324" stroke="#0284c7" stroke-width="0.7" />
    <text x="90" y="132" text-anchor="middle" class="node-badge" fill="#38bdf8">100% Security Pass</text>
  </g>

  <!-- STAGE 3: Registry & GitOps Engine -->
  <g transform="translate(465, 52)">
    <rect width="180" height="152" rx="9" fill="url(#node-bg)" stroke="#0284c7" stroke-width="1.1" />
    <rect x="0" y="0" width="180" height="28" rx="8" fill="#0e2343" />
    <circle cx="16" cy="14" r="4" fill="#38bdf8" />
    <text x="27" y="18" class="node-title" fill="#38bdf8">03. GitOps &amp; Sync</text>
    
    <text x="14" y="48" class="node-badge" fill="#f8fafc">❯ ArgoCD &amp; Helm</text>
    <text x="14" y="66" class="node-sub">• Docker Hub Registry</text>
    <text x="14" y="82" class="node-sub">• Declarative K8s Manifests</text>
    <text x="14" y="98" class="node-sub">• Auto-Sync &amp; Self-Healing</text>

    <rect x="12" y="116" width="156" height="24" rx="6" fill="#081324" stroke="#0284c7" stroke-width="0.7" />
    <text x="90" y="132" text-anchor="middle" class="node-badge" fill="#38bdf8">Zero-Downtime Rollout</text>
  </g>

  <!-- STAGE 4: Production Cloud Cluster & Observability -->
  <g transform="translate(685, 52)">
    <rect width="150" height="152" rx="9" fill="url(#node-bg)" stroke="#1e3a8a" stroke-width="1.1" />
    <rect x="0" y="0" width="150" height="28" rx="8" fill="#0f1f38" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="27" y="18" class="node-title" fill="#10b981">04. AWS Prod</text>
    
    <text x="12" y="48" class="node-badge" fill="#f8fafc">❯ Amazon EKS</text>
    <text x="12" y="66" class="node-sub">• Multi-AZ ALB / ASG</text>
    <text x="12" y="82" class="node-sub">• Prometheus Scraper</text>
    <text x="12" y="98" class="node-sub">• Grafana Observability</text>

    <rect x="10" y="116" width="130" height="24" rx="6" fill="#081324" stroke="#10b981" stroke-width="0.7" />
    <text x="75" y="132" text-anchor="middle" class="node-badge" fill="#10b981">99.99% Resilient</text>
  </g>
</svg>
