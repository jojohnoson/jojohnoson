<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Elegant Dark Radial/Linear Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060608" />
      <stop offset="50%" stop-color="#0e0608" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Smooth Crimson Glow for Title -->
    <linearGradient id="crimson-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="35%" stop-color="#e11d48" />
      <stop offset="65%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f43f5e" />
      <animate attributeName="x1" from="-100%" to="100%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Elegant Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#e11d48" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#fda4af" stop-opacity="1" />
      <stop offset="70%" stop-color="#e11d48" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0.4" />
    </linearGradient>

    <!-- Refined Neon Glow Filter -->
    <filter id="glow-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient-soft">
      <feGaussianBlur stdDeviation="45" />
    </filter>

    <!-- Subtle Technical Grid -->
    <pattern id="tech-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#f43f5e" stroke-width="0.6" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 10.5px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #fb7185;
    }
    .pulse-dot {
      animation: pulse 2.2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.4; r: 3.5px; }
      50% { opacity: 1; r: 5px; }
      100% { opacity: 0.4; r: 3.5px; }
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="220" rx="14" fill="url(#bg-grad)" />

  <!-- Soft Atmospheric Glows -->
  <circle cx="180" cy="80" r="100" fill="#be123c" opacity="0.14" filter="url(#ambient-soft)" />
  <circle cx="720" cy="110" r="120" fill="#9f1239" opacity="0.12" filter="url(#ambient-soft)" />

  <!-- Grid Layer -->
  <rect width="900" height="220" rx="14" fill="url(#tech-grid)" />

  <!-- Outer Border Frame -->
  <rect x="1.5" y="1.5" width="897" height="217" rx="13" fill="none" stroke="url(#border-grad)" stroke-width="1.3" stroke-opacity="0.6" />

  <!-- Corner Brackets -->
  <path d="M 14 32 L 14 16 L 32 16" stroke="#e11d48" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 886 32 L 886 16 L 868 16" stroke="#e11d48" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 14 188 L 14 204 L 32 204" stroke="#e11d48" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 886 188 L 886 204 L 868 204" stroke="#e11d48" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Top Pill Tag -->
  <g transform="translate(315, 22)">
    <rect width="270" height="28" rx="14" fill="#130709" stroke="#e11d48" stroke-width="1" stroke-opacity="0.65" />
    <circle cx="20" cy="14" r="4" fill="#f43f5e" class="pulse-dot" />
    <text x="146" y="18" text-anchor="middle" class="badge-text">BUILDING REAL-WORLD TECH</text>
  </g>

  <!-- Main Name Title -->
  <text x="450" y="104" text-anchor="middle" class="title-text" fill="url(#crimson-glow-grad)" filter="url(#glow-crimson)">
    JOEL JOHNSON BV
  </text>
  <text x="450" y="104" text-anchor="middle" class="title-text" fill="#ffffff" fill-opacity="0.95">
    JOEL JOHNSON BV
  </text>

  <!-- Subtitle Tagline -->
  <text x="450" y="140" text-anchor="middle" class="subtitle-text">
    <tspan fill="#fb7185">ASSOCIATE CLOUD ENGINEER</tspan>
    <tspan fill="#475569"> &#8226; </tspan>
    <tspan fill="#f1f5f9">DEVOPS &amp; SRE</tspan>
    <tspan fill="#475569"> &#8226; </tspan>
    <tspan fill="#fb7185">AWS &amp; KUBERNETES</tspan>
  </text>

  <!-- Sleek Accent Line -->
  <g transform="translate(0, 158)">
    <line x1="220" y1="0" x2="425" y2="0" stroke="url(#border-grad)" stroke-width="1.2" stroke-opacity="0.75" />
    <polygon points="450,-4 454,0 450,4 446,0" fill="#f43f5e" filter="url(#glow-crimson)" />
    <line x1="475" y1="0" x2="680" y2="0" stroke="url(#border-grad)" stroke-width="1.2" stroke-opacity="0.75" />
  </g>

  <!-- Bottom Code Tagline -->
  <g transform="translate(450, 190)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
      <tspan fill="#f43f5e">&lt;/&gt;</tspan> AUTOMATING INFRASTRUCTURE &amp; SCALING RELIABLE SYSTEMS
    </text>
  </g>
</svg>
