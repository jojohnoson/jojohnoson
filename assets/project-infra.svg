<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 185" width="100%" height="185">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="infra-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#081427" />
      <stop offset="100%" stop-color="#030610" />
    </linearGradient>

    <!-- Glowing Border -->
    <linearGradient id="infra-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Node Background -->
    <linearGradient id="inode-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1a32" />
      <stop offset="100%" stop-color="#060d1b" />
    </linearGradient>

    <!-- Tech Grid -->
    <pattern id="infra-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-green {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes flow-anim {
      to { stroke-dashoffset: -32; }
    }
    @keyframes alert-flash {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .flow-dash {
      stroke-dasharray: 6 4;
      animation: flow-anim 1.5s linear infinite;
    }
    .pulse-dot {
      animation: pulse-green 2s ease-in-out infinite;
      transform-origin: 664px 17px;
    }
    .alert-pill {
      animation: alert-flash 1.8s ease-in-out infinite;
    }
    .node-header-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }
    .title-code {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 10.5px;
      font-weight: 700;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 9.5px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .badge-chip {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 9px;
      font-weight: 600;
    }
  </style>

  <!-- Container Box -->
  <rect width="820" height="185" rx="12" fill="url(#infra-bg)" stroke="url(#infra-border)" stroke-width="1.2" />
  <rect width="820" height="185" rx="12" fill="url(#infra-grid)" />

  <!-- Top Bar -->
  <rect x="1" y="1" width="818" height="34" rx="11" fill="#091528" fill-opacity="0.95" />
  <line x1="0" y1="35" x2="820" y2="35" stroke="#1e293b" stroke-width="1" />

  <!-- Traffic Lights -->
  <circle cx="24" cy="18" r="4.5" fill="#ef4444" />
  <circle cx="39" cy="18" r="4.5" fill="#f59e0b" />
  <circle cx="54" cy="18" r="4.5" fill="#10b981" />

  <!-- Top Header Title -->
  <text x="74" y="22" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11" font-weight="600" fill="#64748b">
    AWS MULTI-AZ ARCHITECTURE: <tspan fill="#38bdf8">CHAOS TEST &amp; SELF-HEALING RECOVERY</tspan>
  </text>

  <!-- Live Status Chip -->
  <rect x="650" y="7" width="156" height="21" rx="10.5" fill="#071426" stroke="#0284c7" stroke-width="0.8" />
  <circle cx="664" cy="17.5" r="3.5" fill="#10b981" class="pulse-dot" />
  <text x="674" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" letter-spacing="0.5">AUTO-HEAL: ACTIVE</text>

  <!-- Flow Lines (Animated) -->
  <line x1="262" y1="109" x2="283" y2="109" stroke="#38bdf8" stroke-width="2" class="flow-dash" filter="url(#glow-cyan)" />
  <polygon points="287,109 280,105 280,113" fill="#38bdf8" />

  <line x1="532" y1="109" x2="553" y2="109" stroke="#38bdf8" stroke-width="2" class="flow-dash" filter="url(#glow-cyan)" />
  <polygon points="557,109 550,105 550,113" fill="#38bdf8" />

  <!-- NODE 1: Ingress & ALB (x: 20, width: 240) -->
  <g transform="translate(20, 50)">
    <rect width="240" height="118" rx="8" fill="url(#inode-bg)" stroke="#1e3a8a" stroke-width="1.1" />
    <rect x="0" y="0" width="240" height="26" rx="7" fill="#0f1f38" />
    <circle cx="15" cy="13" r="3.5" fill="#38bdf8" />
    <text x="25" y="17" class="node-header-title" fill="#38bdf8">01. INGRESS &amp; ALB TIER</text>
    
    <text x="14" y="46" class="title-code" fill="#f8fafc">❯ Route 53 ➔ ALB</text>
    <text x="14" y="62" class="sub-text">• Multi-AZ Public Subnets</text>
    <text x="14" y="77" class="sub-text">• Path-Based Route Target Groups</text>
    <text x="14" y="92" class="sub-text">• Health Check Probes (30s)</text>

    <rect x="12" y="99" width="216" height="14" rx="4" fill="#081324" />
    <text x="120" y="109.5" text-anchor="middle" class="badge-chip" fill="#38bdf8">100% Traffic Balanced</text>
  </g>

  <!-- NODE 2: Self-Healing ASG (x: 290, width: 240) -->
  <g transform="translate(290, 50)">
    <rect width="240" height="118" rx="8" fill="url(#inode-bg)" stroke="#0284c7" stroke-width="1.2" />
    <rect x="0" y="0" width="240" height="26" rx="7" fill="#0e2343" />
    <circle cx="15" cy="13" r="3.5" fill="#0ea5e9" />
    <text x="25" y="17" class="node-header-title" fill="#38bdf8">02. MULTI-AZ AUTO SCALING</text>
    
    <text x="14" y="46" class="title-code" fill="#38bdf8">us-east-1a: <tspan fill="#10b981">EC2 Healthy 🟢</tspan></text>
    <text x="14" y="62" class="title-code" fill="#f43f5e">us-east-1b: Crash Injected ⚠️</text>
    <text x="14" y="77" class="sub-text">• ALB Reroutes AZ-1 (0 drops)</text>
    <text x="14" y="92" class="sub-text">• ASG Launches Replacement EC2</text>

    <rect x="12" y="98" width="216" height="15" rx="4" fill="#052e16" stroke="#10b981" stroke-width="0.8" class="alert-pill" />
    <text x="120" y="109" text-anchor="middle" class="badge-chip" fill="#4ade80">● AUTO-HEALED (0 DOWNTIME)</text>
  </g>

  <!-- NODE 3: Production IaC & Persistence (x: 560, width: 240) -->
  <g transform="translate(560, 50)">
    <rect width="240" height="118" rx="8" fill="url(#inode-bg)" stroke="#1e3a8a" stroke-width="1.1" />
    <rect x="0" y="0" width="240" height="26" rx="7" fill="#0f1f38" />
    <circle cx="15" cy="13" r="3.5" fill="#10b981" />
    <text x="25" y="17" class="node-header-title" fill="#10b981">03. TERRAFORM IAC ENGINE</text>
    
    <text x="14" y="46" class="title-code" fill="#f8fafc">❯ Remote S3 Backend</text>
    <text x="14" y="62" class="sub-text">• DynamoDB State Locking</text>
    <text x="14" y="77" class="sub-text">• Multi-AZ RDS Multi-Region</text>
    <text x="14" y="92" class="sub-text">• Jenkins CI/CD Automation</text>

    <rect x="12" y="99" width="216" height="14" rx="4" fill="#081324" />
    <text x="120" y="109.5" text-anchor="middle" class="badge-chip" fill="#10b981">100% Codified in IaC</text>
  </g>
</svg>
