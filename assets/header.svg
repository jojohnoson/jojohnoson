<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Animated shimmer gradient for text -->
    <linearGradient id="shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#38bdf8" />
      <stop offset="30%"  stop-color="#60a5fa" />
      <stop offset="50%"  stop-color="#ffffff" />
      <stop offset="70%"  stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
      <animate attributeName="x1" values="-100%;100%;-100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%;0%"       dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Animated accent line gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0284c7" stop-opacity="0" />
      <stop offset="35%"  stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="50%"  stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="65%"  stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;100%;-100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%;0%"       dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Refined Neon Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-letter {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 42px;
      text-anchor: middle;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #38bdf8;
    }

    .pulse-dot {
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; r: 3.5px; }
      50%      { opacity: 1;   r: 5px; }
    }

    .float-badge {
      animation: waterBobBadge 4s ease-in-out infinite;
    }
    .float-subtitle {
      animation: waterBobSub 4.5s ease-in-out infinite;
    }
    .float-divider {
      animation: waterBobLine 5s ease-in-out infinite;
    }
    .float-tagline {
      animation: waterBobTag 5.5s ease-in-out infinite;
    }

    @keyframes waterBobBadge {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-4px); }
    }
    @keyframes waterBobSub {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-3px); }
    }
    @keyframes waterBobLine {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-3px); }
    }
    @keyframes waterBobTag {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-2px); }
    }

    .diamond-spin {
      animation: dspin 8s linear infinite;
      transform-origin: 450px 0px;
    }
    @keyframes dspin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- 100% Transparent Background -->

  <!-- Tier 1: Floating Status Pill Badge (Centered at 450) -->
  <g class="float-badge">
    <g transform="translate(305, 14)">
      <rect width="290" height="28" rx="14" fill="#070d18" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.85" />
      <circle cx="20" cy="14" r="4" fill="#38bdf8" class="pulse-dot" filter="url(#glow-soft)" />
      <text x="154" y="18.5" text-anchor="middle" class="badge-text">BUILDING REAL-WORLD TECH</text>
    </g>
  </g>

