<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="100%" height="210">
  <defs>
    <!-- Animated shimmer gradient for text -->
    <linearGradient id="shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#38bdf8" />
      <stop offset="30%"  stop-color="#60a5fa" />
      <stop offset="50%"  stop-color="#ffffff" />
      <stop offset="70%"  stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
      <animate attributeName="x1" values="-100%;100%;-100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%;0%"       dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Animated accent line gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0284c7" stop-opacity="0" />
      <stop offset="35%"  stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="50%"  stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="65%"  stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;100%;-100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%;0%"       dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Refined Neon Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #38bdf8;
    }

    /* Pulse dot */
    .pulse-dot {
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; r: 3.5px; }
      50%      { opacity: 1;   r: 5px; }
    }

    /* Floating levitation animations for each tier */
    .float-badge {
      animation: floatA 4.5s ease-in-out infinite;
    }
    .float-title {
      animation: floatB 5s ease-in-out infinite;
    }
    .float-subtitle {
      animation: floatC 5.5s ease-in-out infinite;
    }
    .float-divider {
      animation: floatD 6s ease-in-out infinite;
    }
    .float-tagline {
      animation: floatE 6.5s ease-in-out infinite;
    }

    @keyframes floatA {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-5px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-7px); }
    }
    @keyframes floatC {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-5px); }
    }
    @keyframes floatD {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-4px); }
    }
    @keyframes floatE {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-3px); }
    }

    /* Diamond spin */
    .diamond-spin {
      animation: dspin 8s linear infinite;
      transform-origin: 450px 0px;
    }
    @keyframes dspin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- NO background rect, NO blue card box, NO corner brackets, NO dots - completely transparent -->

  <!-- Tier 1: Floating Status Badge -->
  <g class="float-badge">
    <g transform="translate(305, 14)">
      <rect width="290" height="28" rx="14" fill="#070d18" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.85" />
      <circle cx="20" cy="14" r="4" fill="#38bdf8" class="pulse-dot" filter="url(#glow-soft)" />
      <text x="154" y="18.5" text-anchor="middle" class="badge-text">BUILDING REAL-WORLD TECH</text>
    </g>
  </g>

  <!-- Tier 2: Floating Main Name Title -->
  <g class="float-title">
    <!-- Glow layer -->
    <text x="450" y="96" text-anchor="middle" class="title-text" fill="url(#shimmer-grad)" filter="url(#glow-cyan)">
      JOEL JOHNSON BV
    </text>
    <!-- Sharp white overlay -->
    <text x="450" y="96" text-anchor="middle" class="title-text" fill="#ffffff" fill-opacity="0.95">
      JOEL JOHNSON BV
    </text>
  </g>

  <!-- Tier 3: Floating Subtitle -->
  <g class="float-subtitle">
    <text x="450" y="132" text-anchor="middle" class="subtitle-text">
      <tspan fill="#38bdf8">ASSOCIATE CLOUD ENGINEER</tspan>
      <tspan fill="#475569"> &#8226; </tspan>
      <tspan fill="#f1f5f9">DEVOPS &amp; SRE</tspan>
      <tspan fill="#475569"> &#8226; </tspan>
      <tspan fill="#38bdf8">AWS &amp; KUBERNETES</tspan>
    </text>
  </g>

  <!-- Tier 4: Floating Accent Divider -->
  <g class="float-divider">
    <g transform="translate(0, 150)">
      <line x1="220" y1="0" x2="425" y2="0" stroke="url(#line-grad)" stroke-width="1.4" filter="url(#glow-soft)" />
      <polygon class="diamond-spin" points="450,-4.5 454.5,0 450,4.5 445.5,0" fill="#38bdf8" filter="url(#glow-cyan)" />
      <line x1="475" y1="0" x2="680" y2="0" stroke="url(#line-grad)" stroke-width="1.4" filter="url(#glow-soft)" />
    </g>
  </g>

  <!-- Tier 5: Floating Bottom Code Tagline -->
  <g class="float-tagline">
    <g transform="translate(450, 182)">
      <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
        <tspan fill="#38bdf8">&lt;/&gt;</tspan> AUTOMATING INFRASTRUCTURE &amp; SCALING RELIABLE SYSTEMS
      </text>
    </g>
  </g>
</svg>
