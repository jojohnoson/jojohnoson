<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="80">
  <defs>
    <linearGradient id="footer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0" />
      <stop offset="30%" stop-color="#e11d48" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fda4af" stop-opacity="1" />
      <stop offset="70%" stop-color="#e11d48" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0" />
    </linearGradient>
    <filter id="f-glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Divider Line -->
  <line x1="50" y1="20" x2="850" y2="20" stroke="url(#footer-grad)" stroke-width="1.8" filter="url(#f-glow)" />

  <!-- Center Diamond -->
  <polygon points="450,15 456,20 450,25 444,20" fill="#f43f5e" filter="url(#f-glow)" />
  <circle cx="430" cy="20" r="2" fill="#e11d48" />
  <circle cx="470" cy="20" r="2" fill="#e11d48" />

  <text x="450" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="2">
    CRAFTED WITH PASSION BY <tspan fill="#fb7185">JOEL JOHNSON BV</tspan> &#8226; &#169; 2026
  </text>
</svg>
