<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 185" width="100%" height="185">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="app-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#081427" />
      <stop offset="100%" stop-color="#030610" />
    </linearGradient>

    <!-- Glowing Border -->
    <linearGradient id="app-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Node Background -->
    <linearGradient id="anode-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1a32" />
      <stop offset="100%" stop-color="#060d1b" />
    </linearGradient>

    <!-- Tech Grid -->
    <pattern id="app-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes flow-anim {
      to { stroke-dashoffset: -32; }
    }
    .flow-dash {
      stroke-dasharray: 6 4;
      animation: flow-anim 1.5s linear infinite;
    }
    .pulse-app {
      animation: pulse-dot 2s ease-in-out infinite;
      transform-origin: 668px 18px;
    }
    .title-code {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .badge-chip {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 9.5px;
      font-weight: 600;
    }
  </style>

  <!-- Container Box -->
  <rect width="820" height="185" rx="12" fill="url(#app-bg)" stroke="url(#app-border)" stroke-width="1.2" />
  <rect width="820" height="185" rx="12" fill="url(#app-grid)" />

  <!-- Top Bar -->
  <rect x="1" y="1" width="818" height="34" rx="11" fill="#091528" fill-opacity="0.95" />
  <line x1="0" y1="35" x2="820" y2="35" stroke="#1e293b" stroke-width="1" />

  <!-- Traffic Lights -->
  <circle cx="24" cy="18" r="4.5" fill="#ef4444" />
  <circle cx="39" cy="18" r="4.5" fill="#f59e0b" />
  <circle cx="54" cy="18" r="4.5" fill="#10b981" />

  <!-- Top Header Title -->
  <text x="74" y="22" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#64748b">
    CLOUD-NATIVE EVENT PLATFORM: <tspan fill="#38bdf8">NEXT.JS 14, TYPESCRIPT &amp; DOCKER RUNTIME</tspan>
  </text>

  <!-- Live Status Chip -->
  <rect x="656" y="8" width="150" height="20" rx="10" fill="#071426" stroke="#0284c7" stroke-width="0.8" />
  <circle cx="668" cy="18" r="3.5" fill="#10b981" class="pulse-app" />
  <text x="678" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">EDGE RUNTIME: ACTIVE</text>

  <!-- Flow Lines (Animated) -->
  <line x1="245" y1="110" x2="295" y2="110" stroke="#38bdf8" stroke-width="2" class="flow-dash" filter="url(#glow-cyan)" />
  <polygon points="298,110 290,106 290,114" fill="#38bdf8" />

  <line x1="535" y1="110" x2="585" y2="110" stroke="#38bdf8" stroke-width="2" class="flow-dash" filter="url(#glow-cyan)" />
  <polygon points="588,110 580,106 580,114" fill="#38bdf8" />

  <!-- NODE 1: Next.js Client & Edge Runtime -->
  <g transform="translate(20, 50)">
    <rect width="225" height="118" rx="8" fill="url(#anode-bg)" stroke="#1e3a8a" stroke-width="1.1" />
    <rect x="0" y="0" width="225" height="26" rx="7" fill="#0f1f38" />
    <circle cx="16" cy="13" r="4" fill="#38bdf8" />
    <text x="27" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.5">01. NEXT.JS APP ROUTER</text>
    
    <text x="14" y="46" class="title-code" fill="#f8fafc">❯ React Server Components</text>
    <text x="14" y="63" class="sub-text">• Sub-Second TTFB Latency</text>
    <text x="14" y="78" class="sub-text">• Strict TypeScript Validation</text>
    <text x="14" y="93" class="sub-text">• Tailwind Responsive Design</text>

    <rect x="12" y="100" width="201" height="14" rx="4" fill="#081324" />
    <text x="112" y="110" text-anchor="middle" class="badge-chip" fill="#38bdf8">High Performance UI/UX</text>
  </g>

  <!-- NODE 2: Containerization & Parity -->
  <g transform="translate(295, 50)">
    <rect width="240" height="118" rx="8" fill="url(#anode-bg)" stroke="#0284c7" stroke-width="1.2" />
    <rect x="0" y="0" width="240" height="26" rx="7" fill="#0e2343" />
    <circle cx="16" cy="13" r="4" fill="#0ea5e9" />
    <text x="27" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.5">02. DOCKERIZED ENVIRONMENT</text>
    
    <text x="14" y="46" class="title-code" fill="#38bdf8">Container: <tspan fill="#10b981">Multi-Stage Build 🐳</tspan></text>
    <text x="14" y="63" class="sub-text">• Lean Alpine Production Image</text>
    <text x="14" y="78" class="sub-text">• Local Dev &amp; Cloud Parity</text>
    <text x="14" y="93" class="sub-text">• Automated CI Artifact Packaging</text>

    <rect x="12" y="99" width="216" height="15" rx="4" fill="#052e16" stroke="#10b981" stroke-width="0.8" />
    <text x="120" y="110" text-anchor="middle" class="badge-chip" fill="#4ade80">● 100% ENVIRONMENT PARITY</text>
  </g>

  <!-- NODE 3: Production Edge Deployment -->
  <g transform="translate(585, 50)">
    <rect width="215" height="118" rx="8" fill="url(#anode-bg)" stroke="#1e3a8a" stroke-width="1.1" />
    <rect x="0" y="0" width="215" height="26" rx="7" fill="#0f1f38" />
    <circle cx="16" cy="13" r="4" fill="#10b981" />
    <text x="27" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981" letter-spacing="0.5">03. CLOUD EDGE NETWORK</text>
    
    <text x="14" y="46" class="title-code" fill="#f8fafc">❯ Vercel Edge Global CDN</text>
    <text x="14" y="63" class="sub-text">• High-Throughput Ticketing</text>
    <text x="14" y="78" class="sub-text">• Automatic Edge Caching</text>
    <text x="14" y="93" class="sub-text">• Zero-Downtime Atomic Rollouts</text>

    <rect x="12" y="100" width="191" height="14" rx="4" fill="#081324" />
    <text x="107" y="110" text-anchor="middle" class="badge-chip" fill="#10b981">Global Edge Distribution</text>
  </g>
</svg>
